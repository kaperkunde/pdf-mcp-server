name: Image

# Builds the container image and pushes it to
# ghcr.io/kaperkunde/pdf-mcp-server on a fork tag (kk-v<upstream>-<n>,
# e.g. kk-v2.0.0-1), or by hand. Upstream's own v*.*.* tags are not used
# here, so release.yml and this workflow never fire on the same tag.
# Every action is pinned by commit.

on:
  push:
    tags:
      - "kk-v*"
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kaperkunde/pdf-mcp-server

jobs:
  test:
    name: Test the HTTP entry point
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
      - name: Run the fork's tests
        run: |
          uv sync --frozen --extra ocr --extra dev --python 3.12
          uv run --frozen pytest -q -o addopts="" tests/test_kk_http.py tests/test_registry.py

  image:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=kk-v(.*),group=1
            type=sha,format=long
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND AGPL-3.0-only

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Digest
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
